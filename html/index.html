<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sintonizando</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='8' fill='%23c96a1f'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f2e6;
    --bg-alt: #eee5d0;
    --ink: #201c15;
    --ink-dim: #7a715d;
    --accent: #b3611b;
    --accent-soft: rgba(179, 97, 27, 0.14);
    --rule: #ddd2b6;

    --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --font-body: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f;
      --bg-alt: #201c15;
      --ink: #f3ecd9;
      --ink-dim: #9c9280;
      --accent: #e0913f;
      --accent-soft: rgba(224, 145, 63, 0.16);
      --rule: #3a331fcc;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 60% 50% at 20% 15%, var(--accent-soft), transparent 70%);
  }

  main {
    width: 100%;
    max-width: 40rem;
    display: flex;
    flex-direction: column;
    gap: 2rem;
    z-index: 1;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 0.6em;
  }

  .beacon {
    width: 0.5em;
    height: 0.5em;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.7); }
  }

  canvas#scope {
    width: 100%;
    height: 5rem;
    display: block;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2.25rem, 6vw, 3.75rem);
    line-height: 1.08;
    margin: 0;
    text-wrap: balance;
    max-width: 16ch;
  }

  p.lede {
    font-size: 1.0625rem;
    line-height: 1.6;
    color: var(--ink-dim);
    max-width: 34ch;
    margin: 0;
  }

  dl.status {
    font-family: var(--font-mono);
    font-size: 0.8125rem;
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 1.5rem;
    row-gap: 0.55rem;
    border-top: 1px solid var(--rule);
    padding-top: 1.25rem;
    margin: 0;
  }

  dl.status dt {
    color: var(--ink-dim);
    letter-spacing: 0.06em;
  }

  dl.status dd {
    margin: 0;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  @media (prefers-reduced-motion: reduce) {
    .beacon { animation: none; }
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow"><span class="beacon" aria-hidden="true"></span>Sintonizando</p>

  <canvas id="scope" aria-hidden="true"></canvas>

  <h1>Estamos ajustando o sinal.</h1>

  <p class="lede">Uma nova página está sendo construída aqui. Volte em breve para conferir.</p>

  <dl class="status">
    <dt>Status</dt>
    <dd>Em construção</dd>
    <dt>Sinal</dt>
    <dd>Estabilizando</dd>
    <dt>Previsão</dt>
    <dd>Em breve</dd>
  </dl>
</main>

<script>
  (function () {
    var canvas = document.getElementById('scope');
    var ctx = canvas.getContext('2d');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    function accentColor() {
      return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    }

    function resize() {
      var rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
    }

    function draw(t) {
      var w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.beginPath();
      ctx.lineWidth = 1.5 * dpr;
      ctx.strokeStyle = accentColor();
      ctx.lineJoin = 'round';

      var steps = 140;
      for (var i = 0; i <= steps; i++) {
        var x = (i / steps) * w;
        var progress = i / steps;
        var envelope = Math.sin(progress * Math.PI);
        var wobble = Math.sin(progress * 26 + t) * 0.35 + Math.sin(progress * 71 - t * 1.7) * 0.18;
        var y = h / 2 - wobble * envelope * (h * 0.42);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    resize();
    window.addEventListener('resize', resize);

    if (reduced) {
      draw(0.6);
    } else {
      var start = null;
      function frame(ts) {
        if (start === null) start = ts;
        draw((ts - start) / 500);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
  })();
</script>
</body>
</html>
